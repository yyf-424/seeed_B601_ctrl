# 位置模式控制器（hardware:=mock|dm，command_mode=pos_vel 时用这套）
# 力控模式用 b601_mit_controllers.yaml
controller_manager:
  ros__parameters:
    update_rate: 200
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    b601_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    b601_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
b601_arm_controller:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: false
b601_gripper_controller:
  ros__parameters:
    joints:
    - finger_left
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: true
